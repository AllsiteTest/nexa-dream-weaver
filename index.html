<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- SEO Title -->
    <title>Nexaura India App | Wellness, Membership & Community Platform</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Nexaura India is a modern wellness and community-based digital platform offering membership management, product access, and referral-based networking through a secure mobile app."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="Nexaura India, Nexaura App, wellness app india, membership platform, community networking app, referral based app, Nexaura wellness"
    />

    <!-- Author -->
    <meta name="author" content="Nexaura India" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.nexauraindia.com/" />

    <!-- Open Graph (WhatsApp / Facebook / LinkedIn) -->
    <meta property="og:title" content="Nexaura India Wellness App" />
    <meta
      property="og:description"
      content="A secure wellness and membership-based digital platform for managing products, community networking, and referrals in India."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.nexauraindia.com/" />
    <meta property="og:image" content="https://www.nexauraindia.com/assets/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexaura India App" />
    <meta
      name="twitter:description"
      content="Join Nexaura India – a modern wellness and community-driven membership platform."
    />
    <meta name="twitter:image" content="https://www.nexauraindia.com/assets/og-image.png" />
    <meta name="twitter:site" content="@nexauraindia" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Mobile App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>

  <body>
    <noscript>
      Nexaura India App requires JavaScript to run properly.
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
